<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Im Chloroplasten – Zoom in die Lichtreaktion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap">
<style>
:root{--bg:#06201d;--ink:#e6f2e8;--dim:#8fb3a6;--line:#2a5a4f;--acc:#f5d36b;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);pointer-events:none}
#lv{font-size:21px;font-weight:600;letter-spacing:-.01em}#cap{color:var(--dim);max-width:560px;font-size:13px}
#bot{position:fixed;left:0;right:0;bottom:0;padding:18px 12px calc(env(safe-area-inset-bottom,0px) + 8px);background:linear-gradient(transparent,var(--bg) 22%)}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
#chips button,#tg{flex:none;background:#0d3a33;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:5px 11px;font:inherit;font-size:12px}
#chips button.on{background:var(--acc);color:#1b1a08;border-color:var(--acc)}
#row{display:flex;gap:10px;align-items:center}#zs{flex:1;accent-color:var(--acc)}
#p{display:none;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px;max-height:38vh;overflow:auto}
#p.o{display:grid}#p label{font-size:12px;color:var(--dim);display:flex;flex-direction:column}
#p label.c{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}#p input[type=range]{width:100%;accent-color:#7fd08a;margin:2px 0}
#hint{grid-column:1/-1;font-size:12.5px;color:var(--acc);min-height:34px}
#ms{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.m{font-size:11px;color:var(--dim)}.m i{display:block;height:5px;border-radius:3px;background:var(--acc);width:0;margin-top:2px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><div id="lv"></div><div id="cap"></div></div>
<div id="bot"><div id="chips"></div>
<div id="row"><input id="zs" type="range" min="0" max="5" step="0.001" value="0" aria-label="Zoom"><button id="tg">Regler</button></div>
<div id="p">
<div id="hint"></div>
<div id="ms"><div class="m">Protonengradient<i id="m0"></i></div><div class="m">ATP-Bildung<i id="m1"></i></div><div class="m">NADPH-Bildung<i id="m2"></i></div><div class="m">O₂-Freisetzung<i id="m3"></i></div></div>
<label>Lichtintensität<input type="range" data-k="light" min="0" max="100"></label>
<label>Lichtfarbe <span id="nm"></span><input type="range" data-k="lam" id="lam" min="400" max="700"></label>
<label class="c"><input type="checkbox" data-k="white">Weißlicht</label>
<label>Wasser (Fotolyse)<input type="range" data-k="water" min="0" max="1" step=".01"></label>
<label>NADP⁺ im Stroma<input type="range" data-k="nadp" min="0" max="1" step=".01"></label>
<label class="c"><input type="checkbox" data-k="cyc">Zyklischer Fluss</label>
<label class="c"><input type="checkbox" data-k="dcmu">DCMU (blockiert PS II)</label>
<label class="c"><input type="checkbox" data-k="unc">Entkoppler</label>
</div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),R=4,TAU=6.2832;
const S={light:70,lam:600,white:true,water:1,nadp:1,cyc:false,dcmu:false,unc:false};
const M={H:0,jl:0,jc:0,atp:0};
const LV=[['Chloroplast','Zwei Hüllmembranen umschließen das Stroma. Darin liegen Grana: Stapel aus Thylakoiden. Hier läuft die lichtabhängige Reaktion ab.'],
['Granum','Die Thylakoide sind flache Säckchen. Ihr Innenraum (Lumen) sammelt Protonen, außen liegt das Stroma.'],
['Thylakoidmembran','Vier Komplexe: PS II, Cyt b₆f, PS I und die ATP-Synthase. Elektronen (gelb) fließen von H₂O zu NADP⁺, Protonen (rot) bauen den Gradienten auf.'],
['Photosystem II','Antennenpigmente leiten die Energie der Photonen zum Reaktionszentrum P680. Es gibt Elektronen ab, die Fotolyse des Wassers ersetzt sie.'],
['Chlorophyll a','Der Porphyrinring mit Mg im Zentrum hat ein ausgedehntes π-Elektronensystem. Es absorbiert blaues und rotes Licht. Der Phytolschwanz verankert das Molekül.'],
['Atomare Ebene','Ein Photon hebt ein Elektron auf ein höheres Energieniveau. Von dort kann es an den Akzeptor abgegeben werden (vereinfachtes Bohr-Modell).']];
let W,H,DPR,d=0,T=0,cu=1,lt=0,cl=-1,ub=0,ca={};
function rs(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',rs);rs();
const g=(l,m,s)=>Math.exp(-(((l-m)/s)**2));
const absF=l=>.1+.9*Math.max(g(l,433,20),g(l,680,17),.8*g(l,458,14),.65*g(l,645,14));
const col=()=>S.white?'#fff':`hsl(${270-(S.lam-400)/300*270},95%,62%)`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// UI
const chips=$('chips');LV.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l[0];b.onclick=()=>{T=i};chips.appendChild(b)});
$('tg').onclick=()=>$('p').classList.toggle('o');
const zs=$('zs');zs.oninput=()=>{T=+zs.value};
function hint(){const ab=S.white?.55:absF(S.lam);return S.dcmu?'DCMU blockiert die Weitergabe von PS II an Plastochinon: kein O₂, kaum Gradient, kaum ATP.':S.unc?'Der Entkoppler macht die Membran für H⁺ durchlässig: Der Gradient bricht zusammen, die ATP-Synthase steht fast still.':S.water<.1?'Ohne Wasser fehlt der Ersatz für die Elektronen von P680: Die Elektronentransportkette kommt zum Erliegen.':S.light<5?'Ohne Licht werden keine Elektronen angeregt.':S.nadp<.3?(S.cyc?'NADP⁺ ist knapp, doch der zyklische Fluss pumpt weiter Protonen: ATP entsteht ohne NADPH und O₂.':'NADP⁺ ist knapp: Das Ferredoxin kann seine Elektronen nicht loswerden, der Fluss staut sich.'):S.cyc?'Zyklischer Fluss: Elektronen laufen von PS I zurück zum Cyt b₆f. Es entsteht nur ATP, kein NADPH, kein O₂.':ab<.3?'Grünes Licht wird von Chlorophyll kaum absorbiert, die Reaktion läuft schwach.':'Linearer Elektronentransport: Licht, H₂O, NADP⁺ und ADP+Pᵢ sind ausreichend vorhanden.'}
function sync(){$('lam').disabled=S.white;$('nm').textContent=S.white?'':S.lam+' nm';$('hint').textContent=hint()}
document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;if(e.type=='checkbox')e.checked=S[k];else e.value=S[k];e.oninput=()=>{S[k]=e.type=='checkbox'?e.checked:+e.value;sync()}});sync();
function setD(v){d=T=clamp(v,0,5)}
cv.addEventListener('wheel',e=>{e.preventDefault();T=clamp(T-e.deltaY*.002,0,5)},{passive:false});
const pt=new Map();let pd=0;
cv.onpointerdown=e=>{pt.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{const o=pt.get(e.pointerId);if(!o)return;const n={x:e.clientX,y:e.clientY};
 if(pt.size==2){pt.set(e.pointerId,n);const[a,b]=[...pt.values()],D=Math.hypot(a.x-b.x,a.y-b.y);if(pd)setD(d+Math.log(D/pd)/Math.log(R)*1.3);pd=D}
 else{setD(d+(o.y-n.y)*.005);pt.set(e.pointerId,n)}};
cv.onpointerup=cv.onpointercancel=e=>{pt.delete(e.pointerId);pd=0};
// Zeichenhelfer
const ci=(X,Y,r,f,s,w)=>{x.beginPath();x.arc(X,Y,r,0,TAU);if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=(w||1)/cu;x.stroke()}};
const tx=(t,X,Y,c,z,al)=>{x.fillStyle=c||'#e6f2e8';x.font=(z||12)/cu+'px "Bricolage Grotesque",system-ui,sans-serif';x.textAlign=al||'center';x.fillText(t,X,Y)};
const rr=(X,Y,w,h,r,f,s,lw)=>{x.beginPath();x.roundRect(X,Y,w,h,r);if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=(lw||1)/cu;x.stroke()}};
const ln=(a,b,c,e,s,w)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,e);x.strokeStyle=s;x.lineWidth=(w||1)/cu;x.stroke()};
function photon(X,Y,len,a){x.beginPath();for(let k=0;k<=len;k+=3){const px=X+Math.sin(k*.9)*3,py=Y+k;k?x.lineTo(px,py):x.moveTo(px,py)}x.strokeStyle=col();x.globalAlpha=a;x.lineWidth=2/cu;x.stroke();x.globalAlpha=1}
// Elektronenpfade
const PA=[[-300,100],[-300,0],[-200,-4],[-100,0],[0,70],[100,0],[160,-70],[215,-115]],PB=[[100,0],[150,-80],[0,-125],[-100,-10],[0,70],[100,0]];
const mk=p=>{let c=[0],L=0;for(let i=1;i<p.length;i++){L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);c.push(L)}return{p,c,L}};
const A=mk(PA),B=mk(PB);
const at=(P,s)=>{s=Math.min(s,P.L);let i=1;while(i<P.c.length-1&&P.c[i]<s)i++;const f=(s-P.c[i-1])/(P.c[i]-P.c[i-1]);return[P.p[i-1][0]+(P.p[i][0]-P.p[i-1][0])*f,P.p[i-1][1]+(P.p[i][1]-P.p[i-1][1])*f]};
let E=[],PH=[],LP=[],TP=[],FL=[],PU=[],acc={e:0,p:0,t:0,o:0,u:0},rot=0,pz=0,ph=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
// Simulation
function sim(dt){
 const ab=S.white?.55:absF(S.lam);ph=S.light/100*ab;
 const jl=ph*S.water*(S.dcmu?.04:1)*S.nadp,jc=S.cyc?ph*.6*(S.dcmu?1:1):0;
 M.jl+=(jl-M.jl)*Math.min(1,dt*3);M.jc+=(jc-M.jc)*Math.min(1,dt*3);
 const atp=.9*M.H;
 M.H=clamp(M.H+dt*3*((1.5*M.jl+M.jc)-M.H*(S.unc?3:.35)-atp),0,1);M.atp=atp;
 acc.e+=M.jl*4*dt;while(acc.e>=1){acc.e--;E.push({P:A,s:0,s0:0})}
 acc.u+=M.jc*4*dt;while(acc.u>=1){acc.u--;E.push({P:B,s:0,s0:0})}
 acc.p+=S.light/100*5*dt;while(acc.p>=1){acc.p--;PH.push({x:(Math.random()<.5?-300:100)+rnd(-30,30),y:-260})}
 acc.o+=M.jl*1.5*dt;while(acc.o>=1){acc.o--;FL.push({k:'O₂',x:-335,y:40,vx:-8,vy:-45,l:3})}
 acc.t+=M.atp*7*dt;while(acc.t>=1){acc.t--;TP.push({x:300+rnd(-10,10),t:0})}
 rot+=M.atp*8*dt;
 E=E.filter(e=>{e.s0=e.s;e.s+=140*dt;const c=e.P.c[3];if(e.s0<c&&e.s>=c)LP.push({x:-100+rnd(-8,8),y:18});if(e.s0<e.P.c[1]&&e.s>=e.P.c[1]&&e.P==A){LP.push({x:-300,y:50},{x:-290,y:60})}
  if(e.s>=e.P.L){if(e.P==A)FL.push({k:'NADPH',x:215,y:-125,vx:20,vy:-30,l:2});return false}return true});
 PH=PH.filter(p=>{p.y+=330*dt;if(p.y>-42){if(Math.random()<ab)FL.push({k:'*',x:p.x,y:-42,vx:0,vy:0,l:.25});return false}return true});
 const N=Math.round(10+M.H*80);while(LP.length<N)LP.push({x:rnd(-380,380),y:rnd(25,240)});while(LP.length>N)LP.splice(Math.random()*LP.length|0,1);
 LP.forEach(p=>{p.x=clamp(p.x+rnd(-1,1)*40*dt,-390,390);p.y=clamp(p.y+rnd(-1,1)*40*dt+(p.y<20?60*dt:0),20,250)});
 TP=TP.filter(p=>{p.t+=dt/.8;if(p.t>=1){FL.push({k:'ATP',x:p.x,y:-70,vx:25,vy:-50,l:2});return false}return true});
 FL=FL.filter(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt;return f.l>0});
 if(Math.random()<ph*6*dt)PU.push({a:Math.random()*TAU,t:0});
 PU=PU.filter(p=>{p.t+=dt/.7;if(p.t>=1){pz=1;return false}return true});pz=Math.max(0,pz-dt*3);
 M.o2=M.jl;
}
// Ebenen
function lvl(i,dw,dh,fn){const k=Math.abs(d-i);if(k>=1)return;const tb=$('top').getBoundingClientRect().bottom,bb=$('bot').getBoundingClientRect().top,ah=Math.max(120,bb-tb-30),u=Math.min(W*.96/dw,ah/dh),s=Math.pow(R,d-i);
 x.save();x.globalAlpha=Math.min(1,1.7*(1-k));x.translate(W/2,(tb+bb)/2);cu=s*u;x.scale(cu,cu);fn(i);x.restore()}
const lum=a=>`rgba(150,100,25,${.2+.5*M.H*(a||1)})`;
function L0(){const t=lt;
 x.beginPath();x.ellipse(0,0,235,150,0,0,TAU);x.fillStyle='#14414d';x.fill();x.strokeStyle='#7fd08a';x.lineWidth=6/cu;x.stroke();
 x.beginPath();x.ellipse(0,0,224,139,0,0,TAU);x.strokeStyle='#5fae7c';x.lineWidth=3/cu;x.stroke();
 const G=[[-120,-30],[-25,45],[70,-45],[135,30],[-65,-85],[20,-5]];
 x.strokeStyle='#3f9b5a';x.lineWidth=3/cu;G.forEach((a,i)=>{const b=G[(i+1)%G.length];x.beginPath();x.moveTo(a[0],a[1]);x.quadraticCurveTo((a[0]+b[0])/2+10,(a[1]+b[1])/2+14,b[0],b[1]);x.stroke()});
 G.forEach(a=>{for(let k=0;k<5;k++)rr(a[0]-28,a[1]-28+k*11,56,8,4,`hsl(${140-M.H*40},45%,${38+M.H*14}%)`,'#9be28a',1)});
 x.beginPath();x.ellipse(170,-80,26,16,.3,0,TAU);x.fillStyle='#d9e3d0';x.fill();tx('Stärke',170,-102,'#8fb3a6',11);
 tx('Hülle (2 Membranen)',0,-168,'#9be28a',12);tx('Stroma',-175,70,'#8fb3a6',12);tx('Granum',-120,-70,'#e6f2e8',12);tx('Stromalamelle',60,30,'#8fb3a6',11);
 for(let k=0;k<6;k++){const yy=((t*70*S.light/100+k*58)%340)-170;photon(-200+k*80,yy-30,16,.7)}
 x.globalAlpha=Math.min(1,M.jl*2);tx('O₂ ↑',255,-40,'#e6f2e8',13);}
function L1(){
 for(let k=0;k<6;k++){const y=-115+k*46;rr(-150,y-15,300,30,15,lum(),'#9be28a',4);
  for(let j=0;j<4;j++)rr(-120+j*70,y-19,16,38,6,['#7a5fc2','#4aa3c7','#c25f9a','#e08a3c'][j],null);
  if(k==2)tx('Lumen',100,y+4,'#f5d36b',13)}
 LP.slice(0,40).forEach((p,i)=>ci(-130+(i*53)%260,-115+((i*7)%6)*46+Math.sin(lt*2+i)*5,2.5,'#ff7a6b'));
 tx('Stroma',-120,-22+46*0.5,'#8fb3a6',12);tx('Thylakoidmembran',0,-146,'#9be28a',12);tx('Granum = Thylakoidstapel',0,168,'#e6f2e8',12);
 for(let k=0;k<4;k++)photon(-100+k*70,((lt*90*S.light/100+k*80)%110)-170,16,.6)}
function L2(){
 rr(-400,-270,800,270,0,'#10404f');rr(-400,0,800,270,0,lum());
 rr(-400,-12,800,24,10,'#2f6f4f','#7fd08a',2);
 tx('Stroma',-390,-250,'#8fb3a6',13,'left');tx('Lumen',-390,255,'#f5d36b',13,'left');
 for(let i=0;i<14;i++)ci(-380+i*58+Math.sin(lt+i)*4,-60-((i*37)%150)+Math.cos(lt*.8+i)*4,2.5,'#ff7a6b99');
 LP.forEach(p=>ci(p.x,p.y,2.8,'#ff7a6b'));
 rr(-340,-34,80,68,14,'#7a5fc2','#c6b5ff',2);tx('PS II',-300,-42,'#e6f2e8',12);
 rr(-128,-26,56,54,12,'#4aa3c7','#a5e0f5',2);tx('Cyt b₆f',-100,-34,'#e6f2e8',12);
 rr(65,-30,70,62,14,'#c25f9a','#f0a8d2',2);tx('PS I',100,-38,'#e6f2e8',12);
 rr(280,-12,40,60,6,'#e0873c','#ffc78f',2);ci(300,-52,32,'#e0873c','#ffc78f',2);
 ln(300,-52,300+Math.cos(rot)*30,-52+Math.sin(rot)*30,'#fff',3);tx('ATP-Synthase',300,-100,'#e6f2e8',12);
 ci(-200,-4,8,'#9fe6ff');tx('PQ',-200,-18,'#9fe6ff',11);ci(0,70,9,'#ffd7ef');tx('PC',22,72,'#ffd7ef',11);ci(160,-70,8,'#ffb86b');tx('Fd',178,-72,'#ffb86b',11);
 tx('H₂O → ½ O₂ + 2 H⁺ + 2 e⁻',-300,130,'#e6f2e8',11);ci(-300,100,5,'#9fe6ff');
 tx('NADP⁺ + 2 e⁻ + H⁺ → NADPH',215,-140,'#e6f2e8',11);tx('ADP + Pᵢ',255,-130,'#8fb3a6',10,'left');
 x.setLineDash([4/cu,4/cu]);ln(100,-34,150,-80,'#ffffff55',1);x.setLineDash([]);if(S.cyc)tx('zyklisch',20,-130,'#f5d36b',11);
 PH.forEach(p=>photon(p.x,p.y,18,.9));
 FL.forEach(f=>{if(f.k=='*'){ci(f.x,f.y,22*(1-f.l*3),null,col(),2)}else tx(f.k,f.x,f.y,f.k=='ATP'?'#ffc78f':f.k=='NADPH'?'#ffb86b':'#e6f2e8',f.k=='NADPH'?12:13)});
 TP.forEach(p=>ci(p.x,60-130*p.t,3,'#ff7a6b','#fff',1));
 E.forEach(e=>{const[a,b]=at(e.P,e.s);ci(a,b,4.5,'#ffe45c','#fff8c0',1.5)});
 tx('H⁺-Gradient',-60,215,'#ff9f94',12);}
const AN=[...Array(12)].map((_,i)=>[Math.cos(i*.52)*(105+(i%3)*18)*(1+(i%2)*.1),Math.sin(i*.52)*(75+(i%3)*14)]);
function L3(){
 x.beginPath();x.ellipse(0,0,190,150,0,0,TAU);x.fillStyle='#4d3d8f88';x.fill();x.strokeStyle='#c6b5ff';x.lineWidth=3/cu;x.stroke();
 AN.forEach((a,i)=>{ci(a[0],a[1]-10,11,'#2d7a4a','#9be28a',2)});
 PU.forEach(p=>{const a=AN[(p.a*7|0)%12],q=p.t;ci(a[0]*(1-q),(a[1]-10)*(1-q)-10*q,5,col())});
 ci(0,-10,22+pz*8,pz>0?'#fff':'#9be28a','#e6f2e8',2);tx('P680',0,-6,'#06201d',12);
 tx('Antennenchlorophylle + Carotinoide',0,-128,'#e6f2e8',12);
 [[-24,95],[0,105],[24,95],[0,80]].forEach((a,i)=>ci(a[0],a[1],8,'#e08a3c','#ffc78f',1.5));tx('Mn₄CaO₅ (Wasserspaltung)',0,128,'#ffc78f',11);
 tx('2 H₂O → O₂ + 4 H⁺ + 4 e⁻',0,144,'#9fe6ff',11);tx('e⁻ →',120,-6,'#ffe45c',13);tx('PQ',150,10,'#9fe6ff',11);
 for(let k=0;k<3;k++){const q=(lt*.7+k/3)%1;ci(0,92-q*80,3.5,'#ffe45c')}
 tx('Licht',-150,-150,col(),12);photon(-150,-140,22,.9)}
function L4(){
 const P=[[-54,-54],[54,-54],[54,54],[-54,54]];
 P.forEach(p=>ci(p[0],p[1],36,'#1f5a3a66','#7fd08a',3));
 [[-40,0],[40,0],[0,-40],[0,40]].forEach(n=>{ln(0,0,n[0],n[1],'#a5e0f5',2);ci(n[0],n[1],10,'#3b6fd6','#a5e0f5',1.5)});
 ci(0,0,19,'#9be28a','#fff',2);tx('Mg',0,5,'#06201d',13);tx('N',46,-48,'#a5e0f5',11);
 x.beginPath();x.moveTo(54,54);for(let k=1;k<=10;k++)x.lineTo(54+k*9+(k%2?-10:10),54+k*12);x.strokeStyle='#8fb3a6';x.lineWidth=3/cu;x.stroke();
 tx('Phytolschwanz',100,168,'#8fb3a6',11);tx('(verankert in der Membran)',100,181,'#8fb3a6',10);
 const sp=.3+ph*2;for(let k=0;k<12;k++){const a=lt*sp+k/12*TAU;ci(Math.cos(a)*100,Math.sin(a)*100,3.5,'#ffe45c')}
 x.beginPath();x.arc(0,0,100,0,TAU);x.strokeStyle=`rgba(255,228,92,${.2+ph*.5})`;x.lineWidth=(2+ph*6)/cu;x.stroke();
 tx('π-Elektronensystem',0,-125,'#ffe45c',12);photon(-150,-150+((lt*80)%90),18,.9);tx('Porphyrinring mit Mg²⁺',0,140,'#e6f2e8',12)}
